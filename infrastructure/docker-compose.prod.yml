services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - yubie_pgdata:/var/lib/postgresql/data
    networks: [internal]

  migrate:
    image: ghcr.io/yubiefood-id/yubie-api:${RELEASE_SHA}
    command: ["node", "packages/persistence/dist/scripts/migrate.js"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on: [postgres]
    networks: [internal]

  api:
    image: ghcr.io/yubiefood-id/yubie-api:${RELEASE_SHA}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 8787
      RELEASE_SHA: ${RELEASE_SHA}
      PURCHASE_OPTIONS_SOURCE: database
    depends_on: [postgres, migrate]
    networks: [internal, edge]

  worker:
    image: ghcr.io/yubiefood-id/yubie-worker:${RELEASE_SHA}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RELEASE_SHA: ${RELEASE_SHA}
    depends_on: [postgres, migrate]
    networks: [internal]

networks:
  internal:
  edge:

volumes:
  yubie_pgdata:
