include:
  - path: docker-compose.yml
  - path: docker-compose.prod.yml
  - path: chatwoot/docker-compose.yml

services:
  worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:-http://chatwoot-web:3000}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:-}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:-1}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-fake}
      SUPPORT_PROVIDER: ${SUPPORT_PROVIDER:-fake}
      ZAMMAD_BASE_URL: ${ZAMMAD_BASE_URL:-}
      ZAMMAD_API_TOKEN: ${ZAMMAD_API_TOKEN:-}
      # No default here: the runtime validates fail-closed. Development falls
      # back to the documented local default; staging/production must set the
      # article type discovered from the real Zammad instance.
      ZAMMAD_WHATSAPP_ARTICLE_TYPE: ${ZAMMAD_WHATSAPP_ARTICLE_TYPE:-}
      ZAMMAD_GROUP_BOT_QUEUE: ${ZAMMAD_GROUP_BOT_QUEUE:-}
      ZAMMAD_GROUP_CUSTOMER_SUPPORT: ${ZAMMAD_GROUP_CUSTOMER_SUPPORT:-}
      ZAMMAD_GROUP_SALES_PARTNERSHIP: ${ZAMMAD_GROUP_SALES_PARTNERSHIP:-}
      ZAMMAD_GROUP_FOOD_SAFETY: ${ZAMMAD_GROUP_FOOD_SAFETY:-}
      ZAMMAD_PRIORITY_HIGH: ${ZAMMAD_PRIORITY_HIGH:-}
      YUBIE_ENV: ${YUBIE_ENV:-development}
      BOT_ENGINE: ${BOT_ENGINE:-deterministic}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      ASSISTANT_AUTO_REPLY: ${ASSISTANT_AUTO_REPLY:-false}
      ASSISTANT_MODE: ${ASSISTANT_MODE:-shadow}
      RELEASE_SHA: ${RELEASE_SHA:-dev}
    depends_on: [postgres, migrate]
    networks: [internal]

  bot:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.bot
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CHATWOOT_AGENTBOT_SECRET: ${CHATWOOT_AGENTBOT_SECRET}
      ZAMMAD_WEBHOOK_SECRET: ${ZAMMAD_WEBHOOK_SECRET:-}
      ZAMMAD_WEBHOOK_BEARER: ${ZAMMAD_WEBHOOK_BEARER:-}
      PORT: 8788
      MODEL_PROVIDER: ${MODEL_PROVIDER:-fake}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-fake}
      SUPPORT_PROVIDER: ${SUPPORT_PROVIDER:-fake}
      ASSISTANT_AUTO_REPLY: ${ASSISTANT_AUTO_REPLY:-false}
    depends_on: [postgres, migrate]
    networks: [internal, edge]
    ports:
      - "8788:8788"

networks:
  internal:
  edge:
