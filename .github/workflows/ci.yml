name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: yubie
          POSTGRES_PASSWORD: yubie_local
          POSTGRES_DB: yubie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yubie -d yubie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yubie:yubie_local@127.0.0.1:5432/yubie_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run test --workspace @yubie/persistence
      - run: npm run test --workspace @yubie/assistant
      - run: npm run test --workspace @yubie/worker
      - run: npm run test --workspace @yubie/bot
      - run: npm run test --workspace @yubie/integrations
