name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      # check = lint + typecheck + secret:scan + test (DB-gated suites skip)
      - run: npm run check
      - name: Verify offline operational workbook conversion
        run: |
          python3 -m venv /tmp/yubie-intake-venv
          /tmp/yubie-intake-venv/bin/pip install -r scripts/operations/requirements.txt
          /tmp/yubie-intake-venv/bin/python -m unittest discover -s scripts/operations/tests
      - name: Verify local ERP harness secret handling
        run: npm run test:erp:contracts
      - run: npm run build
      - name: Verify catalog static release artifact
        run: npm run test:catalog
      - name: Upload verified catalog deployment candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-candidate-${{ github.sha }}
          path: .vercel/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: yubie
          POSTGRES_PASSWORD: yubie_local
          POSTGRES_DB: yubie_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yubie -d yubie_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yubie:yubie_local@127.0.0.1:5432/yubie_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run build
      # Fresh install + seeded schema, then the DB-gated suites: migration
      # fresh/upgrade proofs (0005/0007/0008/0009/0010), transaction manager,
      # commerce saga + webhook exactly-once, inventory FEFO, growth consent.
      - run: npm run db:migrate
      - run: npm run db:seed
      - name: Prove restricted release backup, restore and schema checks
        run: python3 scripts/tests/release_postgres_test.py
        env:
          YUBIE_RELEASE_PG_CONTAINER: ${{ job.services.postgres.id }}
          YUBIE_RELEASE_ALLOW_LOCAL_PG: synthetic
      - run: npm run test --workspace @yubie/persistence
      # Legacy upgrade tests intentionally leave their shared fixture on an older
      # schema. Restore the current schema before downstream repository consumers.
      - run: npm run db:migrate
      - run: npm run test --workspace @yubie/api
      - run: npm run test --workspace @yubie/assistant
      - run: npm run test --workspace @yubie/worker
      - run: npm run test --workspace @yubie/bot
      - run: npm run test --workspace @yubie/integrations
      - name: Verify staff identity and audited operations over HTTPS and PostgreSQL
        run: npm run test --workspace @yubie/admin
      - name: Verify private admin against isolated PostgreSQL in Chromium
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.admin.config.ts

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - name: Gitleaks history scan
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
          git /repo --redact --no-banner
      - name: Semgrep financial safety rules
        run: >-
          docker run --rm
          -v "$PWD:/src"
          semgrep/semgrep:1.140.0@sha256:4372a1de903521f9f10f877b6caf15d150d17e1ca592582682c8d02b77cbd4f6
          semgrep scan --error --config /src/.semgrep/payment.yml /src
      # Dependency vulnerabilities are gated by the lockfile scan below;
      # GitHub dependency review needs the repository Dependency graph setting.
      - name: Trivy filesystem scan
        run: >-
          docker run --rm
          -v "$PWD:/workspace"
          aquasec/trivy:0.67.1@sha256:c0ed528623baf6e250e2225010e5fbb4b91f6983595dafc1beb81ff686ba4734
          fs --scanners vuln --include-dev-deps
          --skip-dirs "**/node_modules"
          --skip-dirs "**/.sites-runtime"
          --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL /workspace
      - name: Generate source SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: yubie-source.cdx.json
          upload-artifact: false
      - name: Upload source SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-sbom-${{ github.sha }}
          path: yubie-source.cdx.json
          if-no-files-found: error
          retention-days: 30

  browser:
    needs: quality
    runs-on: ubuntu-latest
    # Playwright browser downloads (chromium+firefox+webkit) can exceed 20m on
    # slow runner network days (two 20m timeouts observed 2026-10-23); 30m
    # leaves room for worst-case install plus the ~8m matrix suite.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run build
      # The Azure mirror stalled package downloads for >29m on 2026-10-26.
      # Keep Ubuntu's signed packages and the full browser matrix; change only
      # the ephemeral runner's mirror, not package versions or production hosts.
      - name: Use the official Ubuntu HTTPS archive for browser dependencies
        run: |
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt; do
            if [ -f "$source" ]; then
              sudo sed -i 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
      - run: npm run test:e2e:install
      - run: node --test scripts/browser-tests/*.test.mjs
      # Browser requests to checkout/auth APIs are intercepted with synthetic,
      # non-PII fixtures. This job never receives PSP or production secrets.
      - run: npm run test:e2e
        env:
          E2E_BROWSER_MATRIX: full
      - name: Download the verified catalog candidate from this workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: catalog-candidate-${{ github.sha }}
          path: .vercel/output/
      - name: Verify the candidate digest before browser acceptance
        run: npm run verify:catalog
      - name: Verify the exact static candidate across the browser matrix
        run: npm run test:e2e:catalog
        env:
          E2E_BROWSER_MATRIX: full
          E2E_CATALOG_PREBUILT: "1"
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            artifacts/qa/**/report.json
            artifacts/qa/**/junit.xml
            artifacts/qa/**/index.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Build and scan the exact local images. Publication remains manual.
      - name: Prove root installer and sudo boundaries in an isolated fixture
        run: |
          docker build -f scripts/production/Dockerfile.root-tests -t yubie-release-root-tests:ci scripts
          docker run --rm --network none yubie-release-root-tests:ci
      - run: docker build -f infrastructure/docker/Dockerfile.api -t yubie-api:ci .
      - run: docker build -f infrastructure/docker/Dockerfile.worker -t yubie-worker:ci .
      - run: docker build -f infrastructure/docker/Dockerfile.bot -t yubie-bot:ci .
      - run: docker build -f infrastructure/docker/Dockerfile.admin -t yubie-admin:ci .
      - name: Verify runtime dependency closure without credentials
        run: |
          for image in yubie-api:ci yubie-worker:ci yubie-bot:ci yubie-admin:ci; do
            docker run --rm --entrypoint node "$image" --input-type=module -e "await import('@yubie/integrations'); await import('@yubie/persistence');"
          done
      - name: Trivy image scans
        run: |
          for image in yubie-api:ci yubie-worker:ci yubie-bot:ci yubie-admin:ci; do
            archive="/tmp/${image/:/-}.tar"
            docker save "$image" --output "$archive"
            docker run --rm \
              -v "$archive:/image.tar:ro" \
              aquasec/trivy:0.67.1@sha256:c0ed528623baf6e250e2225010e5fbb4b91f6983595dafc1beb81ff686ba4734 \
              image --scanners vuln --input /image.tar --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          done

  dispatch-release-candidate:
    # Green-main bot dispatch of the RC (actor separation for the staging
    # environment approval: the required reviewer cannot approve a run their
    # own identity dispatched). GITHUB_TOKEN -> workflow_dispatch is one of
    # the documented recursion exceptions. The RC's own gates re-verify
    # current main + 5/5 green before anything is published; a concurrency
    # group supersedes stale waiting RC runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, persistence, security, browser, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch release-candidate for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-candidate.yml --ref "${{ github.ref }}" -f sha="${{ github.sha }}"
