name: Release candidate

# Manual, immutable staging-candidate publication (mission E7):
#   - no automatic production deploy, no VPS secrets
#   - images are tagged with the EXACT requested commit SHA (immutable)
#   - CI must already be green on that SHA; this workflow re-verifies the
#     build before pushing so an untested SHA can never be published
#   - digests are reported in the job summary for the deploy runbook
#
# Publish ONLY trusted SHAs (main or reviewed branches). Never dispatch this
# on untrusted PR code: the job holds GITHUB_TOKEN packages:write.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to publish (defaults to the SHA this run was dispatched on)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TARGET_SHA: ${{ github.event.inputs.sha || github.sha }}
    steps:
      - name: Resolve and validate target SHA
        run: |
          echo "$TARGET_SHA" | grep -E '^[0-9a-f]{40}$' || { echo "TARGET_SHA must be a full 40-char commit SHA"; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify the target SHA is green on CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "quality" or .name == "persistence" or .name == "containers")] | {total: length, success: [.[] | select(.conclusion == "success")] | length}')
          total=$(echo "$conclusion" | jq -r .total)
          success=$(echo "$conclusion" | jq -r .success)
          echo "CI on ${TARGET_SHA}: $success/$total required jobs green"
          if [ "$total" -lt 3 ] || [ "$success" -ne "$total" ]; then
            echo "Refusing to publish: CI is not fully green on ${TARGET_SHA}."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish yubie-api @ SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yubie-api:${{ env.TARGET_SHA }}
          provenance: false

      - name: Build and publish yubie-worker @ SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yubie-worker:${{ env.TARGET_SHA }}
          provenance: false

      - name: Build and publish yubie-bot @ SHA
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.bot
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yubie-bot:${{ env.TARGET_SHA }}
          provenance: false

      - name: Report digests
        run: |
          {
            echo "## Release candidate images"
            echo ""
            echo "Commit: \`${TARGET_SHA}\`"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            for name in yubie-api yubie-worker yubie-bot; do
              digest=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/${name}:${TARGET_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')
              echo "| \`ghcr.io/${{ github.repository_owner }}/${name}:${TARGET_SHA}\` | \`${digest}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
