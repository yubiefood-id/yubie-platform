name: Release candidate

# Manual, immutable staging-candidate publication (mission E7):
#   - no automatic production deploy, no VPS secrets
#   - images are tagged with the EXACT requested commit SHA (immutable)
#   - CI must already be green on that SHA; this workflow re-verifies the
#     build before pushing so an untested SHA can never be published
#   - digests are reported in the job summary for the deploy runbook
#
# Publish ONLY trusted SHAs (main or reviewed branches). Never dispatch this
# on untrusted PR code: the job holds GITHUB_TOKEN packages:write.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full commit SHA to publish (defaults to the SHA this run was dispatched on)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TARGET_SHA: ${{ github.event.inputs.sha || github.sha }}
    steps:
      - name: Resolve and validate target SHA
        run: |
          echo "$TARGET_SHA" | grep -E '^[0-9a-f]{40}$' || { echo "TARGET_SHA must be a full 40-char commit SHA"; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Require the current main SHA
        run: |
          git fetch origin main --depth=1
          main_sha=$(git rev-parse origin/main)
          if [ "$TARGET_SHA" != "$main_sha" ]; then
            echo "Refusing to publish: ${TARGET_SHA} is not current origin/main ${main_sha}."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.3
          cache: npm

      - name: Verify the target SHA is green on CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/${TARGET_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "quality" or .name == "persistence" or .name == "security" or .name == "browser" or .name == "containers")] | {total: length, success: [.[] | select(.conclusion == "success")] | length}')
          total=$(echo "$conclusion" | jq -r .total)
          success=$(echo "$conclusion" | jq -r .success)
          echo "CI on ${TARGET_SHA}: $success/$total required jobs green"
          if [ "$total" -lt 5 ] || [ "$success" -ne "$total" ]; then
            echo "Refusing to publish: CI is not fully green on ${TARGET_SHA}."
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build release images for pre-push verification
        run: |
          docker build -f infrastructure/docker/Dockerfile.api -t yubie-api:rc .
          docker build -f infrastructure/docker/Dockerfile.worker -t yubie-worker:rc .
          docker build -f infrastructure/docker/Dockerfile.bot -t yubie-bot:rc .

      - name: Block publication on image vulnerabilities
        run: |
          for image in yubie-api:rc yubie-worker:rc yubie-bot:rc; do
            archive="/tmp/${image/:/-}.tar"
            docker save "$image" --output "$archive"
            docker run --rm \
              -v "$archive:/image.tar:ro" \
              aquasec/trivy:0.67.1@sha256:c0ed528623baf6e250e2225010e5fbb4b91f6983595dafc1beb81ff686ba4734 \
              image --scanners vuln --input /image.tar --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          done

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish yubie-api @ SHA
        id: build-api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yubie-api:${{ env.TARGET_SHA }}
          labels: org.opencontainers.image.revision=${{ env.TARGET_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build and publish yubie-worker @ SHA
        id: build-worker
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yubie-worker:${{ env.TARGET_SHA }}
          labels: org.opencontainers.image.revision=${{ env.TARGET_SHA }}
          provenance: mode=max
          sbom: true

      - name: Build and publish yubie-bot @ SHA
        id: build-bot
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/Dockerfile.bot
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yubie-bot:${{ env.TARGET_SHA }}
          labels: org.opencontainers.image.revision=${{ env.TARGET_SHA }}
          provenance: mode=max
          sbom: true

      - name: Export published images for digest verification
        run: |
          for image in \
            "ghcr.io/${{ github.repository_owner }}/yubie-api@${{ steps.build-api.outputs.digest }}" \
            "ghcr.io/${{ github.repository_owner }}/yubie-worker@${{ steps.build-worker.outputs.digest }}" \
            "ghcr.io/${{ github.repository_owner }}/yubie-bot@${{ steps.build-bot.outputs.digest }}"; do
            archive="/tmp/$(echo "$image" | cut -d/ -f3 | cut -d@ -f1)-published.tar"
            docker pull "$image"
            docker save "$image" --output "$archive"
          done

      - name: Verify published images with Trivy
        run: |
          for archive in /tmp/yubie-api-published.tar /tmp/yubie-worker-published.tar /tmp/yubie-bot-published.tar; do
            docker run --rm \
              -v "$HOME/.cache/trivy:/root/.cache/" \
              -v "$archive:/image.tar:ro" \
              aquasec/trivy:0.67.1@sha256:c0ed528623baf6e250e2225010e5fbb4b91f6983595dafc1beb81ff686ba4734 \
              image --scanners vuln --input /image.tar --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL
          done

      - name: Generate API SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/yubie-api@${{ steps.build-api.outputs.digest }}
          format: cyclonedx-json
          output-file: yubie-api.cdx.json
          upload-artifact: false

      - name: Generate worker SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/yubie-worker@${{ steps.build-worker.outputs.digest }}
          format: cyclonedx-json
          output-file: yubie-worker.cdx.json
          upload-artifact: false

      - name: Generate bot SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/yubie-bot@${{ steps.build-bot.outputs.digest }}
          format: cyclonedx-json
          output-file: yubie-bot.cdx.json
          upload-artifact: false

      - name: Upload release SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sboms-${{ env.TARGET_SHA }}
          path: yubie-*.cdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Report digests
        run: |
          {
            echo "## Release candidate images"
            echo ""
            echo "Commit: \`${TARGET_SHA}\`"
            echo ""
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`ghcr.io/${{ github.repository_owner }}/yubie-api:${TARGET_SHA}\` | \`${{ steps.build-api.outputs.digest }}\` |"
            echo "| \`ghcr.io/${{ github.repository_owner }}/yubie-worker:${TARGET_SHA}\` | \`${{ steps.build-worker.outputs.digest }}\` |"
            echo "| \`ghcr.io/${{ github.repository_owner }}/yubie-bot:${TARGET_SHA}\` | \`${{ steps.build-bot.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
